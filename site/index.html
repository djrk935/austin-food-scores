<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Austin Food Scores</title>
  <meta name="description" content="Search health inspection scores for Austin-area restaurants on a 2D or 3D map, from official City of Austin data.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <div id="map" role="region" aria-label="Map of restaurants colored by latest inspection score"></div>

  <aside class="panel" aria-label="Restaurant inspection scores">
    <header class="top">
      <a href="#/" class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        Austin Food Scores
      </a>
      <p class="tagline" id="tagline">Health inspection scores for Austin-area restaurants.</p>
    </header>

    <label class="search" for="q">
      <span class="visually-hidden">Search restaurants</span>
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Search a restaurant, street or ZIP" disabled>
    </label>

    <div id="view" aria-live="polite">
      <p class="muted">Loading inspection data…</p>
    </div>

    <footer class="foot">
      <p id="source">Data: City of Austin, Austin Public Health.</p>
      <p>Scores reflect conditions on the day of each inspection. Independent site, not affiliated with the City of Austin.</p>
    </footer>
  </aside>

  <div class="map-ui">
    <div class="segmented" role="group" aria-label="Map view">
      <button type="button" data-mode="2d" aria-pressed="true">2D</button>
      <button type="button" data-mode="3d" aria-pressed="false">3D</button>
    </div>
  </div>

  <ul class="legend" aria-label="Score colors">
    <li><span class="dot good"></span>90–100</li>
    <li><span class="dot ok"></span>70–89</li>
    <li><span class="dot bad"></span>Under 70</li>
  </ul>

  <script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
  <script src="links.js?v=1"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
