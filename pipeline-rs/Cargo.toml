[package]
name = "pipeline-rs"
version = "0.1.0"
edition = "2024"
description = "Builds Austin Food Scores data from the City of Austin inspection dataset"
publish = false

[dependencies]
# Latest releases within the approved major versions, as of 2026-11-26.
clap = { version = "4.6.10", features = ["derive"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "2.12.1"
sha2 = "0.10.9"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.105"
